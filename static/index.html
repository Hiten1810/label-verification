<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label Checker</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --ink: #1b1f24; --muted: #5b6470; --line: #d5d9df;
    --pass: #1a7f37; --pass-bg: #e6f4ea;
    --review: #8a5a00; --review-bg: #fff3d6;
    --fail: #b3261e; --fail-bg: #fde7e5;
    --accent: #0b4f8a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 19px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 20px; margin-bottom: 20px; }
  .step { font-weight: 700; color: var(--accent); margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  .hint { font-weight: 400; color: var(--muted); font-size: .85em; }
  input[type=text] { width: 100%; font: inherit; padding: 12px; border: 2px solid var(--line);
                     border-radius: 8px; }
  input[type=text]:focus, input[type=file]:focus, button:focus-visible, summary:focus-visible
    { outline: 3px solid var(--accent); outline-offset: 2px; }
  input[type=file] { width: 100%; font: inherit; padding: 12px; border: 2px dashed var(--line);
                     border-radius: 8px; background: #fafbfc; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  button.primary { width: 100%; font: inherit; font-weight: 700; font-size: 1.15rem; padding: 16px;
                   background: var(--accent); color: #fff; border: 0; border-radius: 10px;
                   cursor: pointer; margin-top: 8px; }
  button.primary:disabled { opacity: .6; cursor: progress; }
  button.link { font: inherit; background: none; border: 0; color: var(--accent);
                text-decoration: underline; cursor: pointer; padding: 0; }
  #preview { max-width: 100%; max-height: 260px; margin-top: 12px; border-radius: 8px;
             border: 1px solid var(--line); display: none; }
  #error { display: none; background: var(--fail-bg); color: var(--fail); border: 2px solid var(--fail);
           border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; font-weight: 600; }
  #results { display: none; }
  .banner { border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; font-weight: 700;
            font-size: 1.3rem; border: 2px solid; }
  .banner small { display: block; font-weight: 400; font-size: .75em; margin-top: 2px; color: var(--ink); }
  .pass { background: var(--pass-bg); color: var(--pass); border-color: var(--pass); }
  .review { background: var(--review-bg); color: var(--review); border-color: var(--review); }
  .fail { background: var(--fail-bg); color: var(--fail); border-color: var(--fail); }
  .item { border-radius: 10px; border: 2px solid; padding: 12px 16px; margin-bottom: 10px; }
  .item .head { font-weight: 700; }
  .item .msg { color: var(--ink); margin-top: 2px; }
  .item .cmp { font-size: .85em; color: var(--ink); margin-top: 6px; opacity: .85; word-break: break-word; }
  details { margin-top: 12px; }
  summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  pre { white-space: pre-wrap; background: #f0f2f5; padding: 12px; border-radius: 8px;
        font-size: .8em; overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>Label Checker</h1>
  <p class="sub">Compare a label image to its application. Takes a few seconds.</p>

  <form id="form" class="card" novalidate>
    <p class="step">Step 1: Enter the application details</p>
    <label for="brand">Brand name</label>
    <input id="brand" name="brand_name" type="text" autocomplete="off" placeholder="e.g. OLD TOM DISTILLERY">
    <label for="cls">Class / type</label>
    <input id="cls" name="class_type" type="text" autocomplete="off" placeholder="e.g. Kentucky Straight Bourbon Whiskey">
    <div class="row">
      <div>
        <label for="abv">Alcohol content <span class="hint">(% by volume)</span></label>
        <input id="abv" name="abv" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 45">
      </div>
      <div>
        <label for="net">Net contents</label>
        <input id="net" name="net_contents" type="text" autocomplete="off" placeholder="e.g. 750 mL">
      </div>
    </div>

    <p class="step" style="margin-top:24px">Step 2: Choose the label image</p>
    <input id="image" name="image" type="file" accept="image/*">
    <img id="preview" alt="Preview of the chosen label">

    <p class="step" style="margin-top:24px">Step 3: Check it</p>
    <button class="primary" id="go" type="submit">Check Label</button>
    <p style="margin:12px 0 0"><button class="link" type="button" id="sample">Fill in sample values</button></p>
  </form>

  <div id="error" role="alert"></div>

  <section id="results" aria-live="polite">
    <div id="banner" class="banner"></div>
    <div id="items"></div>
    <details>
      <summary>What the scanner read from the image</summary>
      <pre id="ocr"></pre>
    </details>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const ICON = { pass: "✔", review: "⚠", fail: "✖" };
const WORD = { pass: "Matches", review: "Needs review", fail: "Does not match" };
const OVERALL = {
  pass: "All checks passed",
  review: "Needs a human look",
  fail: "Problems found",
};

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;   // textContent: never inject label text as HTML
  return n;
}

function showError(msg) {
  const e = $("error");
  e.textContent = msg;
  e.style.display = "block";
  $("results").style.display = "none";
  e.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

$("image").addEventListener("change", (ev) => {
  const f = ev.target.files[0];
  const p = $("preview");
  if (!f) { p.style.display = "none"; return; }
  p.src = URL.createObjectURL(f);
  p.style.display = "block";
});

$("sample").addEventListener("click", () => {
  $("brand").value = "OLD TOM DISTILLERY";
  $("cls").value = "Kentucky Straight Bourbon Whiskey";
  $("abv").value = "45";
  $("net").value = "750 mL";
});

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("error").style.display = "none";

  const missing = [];
  if (!$("brand").value.trim()) missing.push("Brand name");
  if (!$("cls").value.trim()) missing.push("Class / type");
  if (!$("abv").value.trim()) missing.push("Alcohol content");
  if (!$("net").value.trim()) missing.push("Net contents");
  if (missing.length) return showError("Please fill in: " + missing.join(", ") + ".");
  if (!$("image").files[0]) return showError("Please choose a label image.");

  const btn = $("go");
  btn.disabled = true;
  btn.textContent = "Checking…";
  try {
    const res = await fetch("/api/verify", { method: "POST", body: new FormData($("form")) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return showError(data.detail || "Something went wrong. Please try again.");
    render(data);
  } catch (err) {
    showError("Couldn't reach the server. Please check your connection and try again.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Check Label";
  }
});

function render(data) {
  const banner = $("banner");
  banner.className = "banner " + data.overall;
  banner.textContent = ICON[data.overall] + " " + OVERALL[data.overall];
  banner.appendChild(el("small", "", "Checked in " + data.seconds + " seconds"));

  const items = $("items");
  items.replaceChildren();
  for (const r of data.results) {
    const box = el("div", "item " + r.status);
    box.appendChild(el("div", "head", ICON[r.status] + " " + r.field + ": " + WORD[r.status]));
    box.appendChild(el("div", "msg", r.message));
    if (r.field !== "Government warning" && r.status !== "pass") {
      box.appendChild(el("div", "cmp", "Application: " + r.expected + "   |   Label: " + (r.found || "not found")));
    }
    items.appendChild(box);
  }
  $("ocr").textContent = data.ocr_text;
  $("results").style.display = "block";
  banner.scrollIntoView({ behavior: "smooth", block: "start" });
}
</script>
</body>
</html>
